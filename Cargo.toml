[package]
name = "astra"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A Tempest Weather Station applet for the COSMIC™ desktop"
repository = "https://github.com/JasonBrannon/astra-weather-applet"

[build-dependencies]
vergen = { version = "8", features = ["git", "gitcl"] }

[dependencies]
futures-util = "0.3.31"
i18n-embed-fl = "0.9.2"
open = "5.3.0"
rust-embed = "8.5.0"
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter"] }
rand = "0.8"
notify-rust = "4.11"
dirs = "5.0"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
url = "2.5"
keyring = { version = "3.6", features = ["sync-secret-service"] }

[dependencies.i18n-embed]
version = "0.15"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [

    # Applet support for panel integration
    "applet",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
